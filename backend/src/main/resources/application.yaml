server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/autolog_db
    username: autolog
    password: autolog1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

autolog:
  auth:
    bootstrap-admin-username: ${AUTOLOG_AUTH_USERNAME:}
    bootstrap-admin-password: ${AUTOLOG_AUTH_PASSWORD:}
    demo-mechanics: '${AUTOLOG_DEMO_MECHANICS:[]}'
    jwt-secret: ${AUTOLOG_JWT_SECRET:}
    token-lifetime-minutes: 60